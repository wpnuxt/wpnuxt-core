packages:
  - packages/*
  - playgrounds/*
  - docs

# Moved from .npmrc, which pnpm 11 no longer reads these settings from
hoistPattern:
  - '*'
publicHoistPattern:
  - '*'
  - '!nuxt'
  - '!@nuxt/nitro-server'
  - '!@nuxt/vite-builder'
strictPeerDependencies: false

# Moved from the package.json "pnpm" field, which pnpm 10 no longer reads
overrides:
  # Follow whatever nuxt-graphql-middleware peers on: 5.4.0 wants graphql ^16.0.0 and its
  # graphql-typescript-deluxe hard-deps ^16.12.0. graphql 17 loads a second instance, every
  # instanceof check fails, and type gen dies with a misleading "Cannot build selection set
  # for type: X". Re-check this pin whenever nuxt-graphql-middleware is updated.
  graphql: ^16
  typescript: ^5.9.3
  listhen@1.9.1>crossws: 0.4.4
  # Pin exactly, do not loosen to a range. A range override only constrains resolutions, it
  # does not collapse them: @nuxt/test-utils hard-deps vue 3.5.40, so pnpm kept a second copy
  # and publicHoistPattern hoisted it to node_modules/vue, while nuxt and reka-ui resolved
  # 3.5.41. Two @vue/runtime-core instances means currentRenderingInstance is null in
  # renderSlot, which crashes hydration with "Cannot read properties of null (reading 'ce')".
  vue: 3.5.41
  '@vue/server-renderer': 3.5.41

packageExtensions:
  nuxt-graphql-middleware@5.4.0:
    dependencies:
      h3: 1.15.11

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver
  - vue-demi

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
